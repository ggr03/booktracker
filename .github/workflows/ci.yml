name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]   # minimum supported + newest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python app.py --version
      - run: python app.py paths

  rhel-family:
    # RHEL/Rocky/Alma 9: stock python3 is 3.9 (too old), so this checks the
    # documented route -- the parallel-installable python3.12 package.
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - uses: actions/checkout@v5
      - run: dnf install -y python3.12 python3.12-pip
      - run: python3.12 -m venv venv && venv/bin/pip install -r requirements.txt
      - run: venv/bin/python -m unittest discover -s tests -v

  debian:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y python3 python3-venv
      - run: python3 -m venv venv && venv/bin/pip install -r requirements.txt
      - run: venv/bin/python -m unittest discover -s tests -v
